name: Daily Token Equivalence

permissions:
  contents: write

on:
  schedule:
    # Morning, so the meter lands in step with the 06:30 ledger instead of
    # trailing it by most of a day — at 20:15 the default measure on /tokens
    # read a day behind the ledger for fourteen hours out of every twenty-four.
    #
    # Not 06:45, though it wants to be: scheduled runs here start 39–54 minutes
    # after their cron, so a 15-minute nominal gap would put this job inside the
    # ledger's window, and both push dashboard/data. The concurrency group below
    # is the real guard; this spacing keeps it from being exercised daily.
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch:

# Three workflows commit dashboard/data and push with no rebase, so two that
# overlap would end with the loser failing on a non-fast-forward. Queue them.
concurrency:
  group: dashboard-data-write
  cancel-in-progress: false

jobs:
  run-equivalence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily meter (flagship N=1, workhorse N=1)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TRACKER_AMAZON_API_KEY: ${{ secrets.TRACKER_AMAZON_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          python scripts/run_equivalence_tasks.py --mode two --workhorse-replicates 1

      # Keys are passed here too: the builder records which provider
      # credentials are visible, and without them that field reads "none
      # configured" on a run whose collection actually worked.
      - name: Rebuild dashboard datasets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TRACKER_AMAZON_API_KEY: ${{ secrets.TRACKER_AMAZON_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          python scripts/build_dashboard_data.py --rebuild

      # No "[skip ci]" — see the note in daily-tokenizer-ledger.yml: Netlify
      # honours the marker, and this repo is repo-linked, so it would publish
      # stale data (I16). Nothing here runs on `push`.
      - name: Commit daily equivalence artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dashboard/data/
          git commit -m "Auto-update daily token equivalence" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      # Runs after the push on purpose: whatever a healthy provider collected
      # should still publish. This step exists so a provider that collected
      # NOTHING fails the job instead of passing silently.
      - name: Verify collection health
        id: verify
        run: |
          python scripts/ops/verify_token_runs.py \
            --sources meter --sources ledger \
            --run-id "${GITHUB_RUN_ID}"

      - name: Upload token run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-run-report
          path: ops/token_run_report.json
          if-no-files-found: ignore

      - name: Emit ops incident (success)
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          COFAIR_OPS_SOURCE: colonial-token-equivalence
        run: |
          if [ -f ops/token_run_report.json ]; then
            STATUS=$(python -c "import json; print(json.load(open('ops/token_run_report.json')).get('status','success'))")
            if [ "$STATUS" = "degraded" ]; then
              ERROR=$(python -c "import json; print('ACTION REQUIRED: ' + json.load(open('ops/token_run_report.json')).get('error','provider account fault'))")
              python scripts/ops/emit_pipeline_incident.py \
                --pipeline colonial-token-equivalence \
                --status degraded \
                --error "$ERROR" \
                --run-id "${GITHUB_RUN_ID}"
              exit 0
            fi
          fi
          python scripts/ops/emit_pipeline_incident.py \
            --pipeline colonial-token-equivalence \
            --status success \
            --run-id "${GITHUB_RUN_ID}"

      - name: Notify pipeline failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          COFAIR_OPS_SOURCE: colonial-token-equivalence
        run: |
          python scripts/ops/emit_pipeline_incident.py \
            --pipeline colonial-token-equivalence \
            --status failed \
            --error "token equivalence workflow failed" \
            --run-id "${GITHUB_RUN_ID}"
