name: Daily Tokenizer Ledger

permissions:
  contents: write

on:
  schedule:
    - cron: "30 6 * * *" # daily 06:30 UTC
  workflow_dispatch:

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Count-only ledger (tasks A+B+C+D)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TRACKER_AMAZON_API_KEY: ${{ secrets.TRACKER_AMAZON_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          python scripts/run_tokenizer_ledger.py --tasks ABCD --mode two
      # Keys are passed here too: the builder records which provider
      # credentials are visible, and without them that field reads "none
      # configured" on a run whose collection actually worked.
      - name: Rebuild dashboard datasets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TRACKER_AMAZON_API_KEY: ${{ secrets.TRACKER_AMAZON_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          python scripts/build_dashboard_data.py --rebuild
      # No "[skip ci]" in the message: Netlify honours it too, and this repo is
      # now repo-linked, so the marker would leave the published dashboard
      # serving stale data forever (I16). Nothing here runs on `push`, so there
      # is no loop to guard against.
      - name: Commit ledger artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dashboard/data/
          git commit -m "Auto-update daily tokenizer ledger" || echo "No changes to commit"
          git push

      # Runs after the push on purpose: whatever a healthy provider collected
      # should still publish. This step exists so a provider that collected
      # NOTHING fails the job instead of passing silently.
      - name: Verify collection health
        run: |
          python scripts/ops/verify_token_runs.py --sources ledger

      - name: Emit ops incident (success)
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          COFAIR_OPS_SOURCE: colonial-tokenizer-ledger
        run: |
          python scripts/ops/emit_pipeline_incident.py \
            --pipeline colonial-tokenizer-ledger \
            --status success \
            --run-id "${GITHUB_RUN_ID}"

      - name: Notify pipeline failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          COFAIR_OPS_SOURCE: colonial-tokenizer-ledger
        run: |
          python scripts/ops/emit_pipeline_incident.py \
            --pipeline colonial-tokenizer-ledger \
            --status failed \
            --error "tokenizer ledger workflow failed" \
            --run-id "${GITHUB_RUN_ID}"
