<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!--
    When proxied at cofair.org/pricing (no trailing slash), relative asset
    URLs would resolve to cofair.org/vendor/… and 404. Set <base> before any
    stylesheet/script so both /pricing and /pricing/ work. On the origin
    site (cofair-colonial.netlify.app/) pathname is "/" — leave base alone.
  -->
  <script>
    (function () {
      var path = location.pathname;
      if (path === "/pricing" || path === "/pricing/") {
        var base = document.createElement("base");
        base.href = "/pricing/";
        document.head.prepend(base);
        if (path === "/pricing") {
          history.replaceState(null, "", "/pricing/" + location.search + location.hash);
        }
      }
    })();
  </script>
  <title>AI model pricing — historical trends · COFAIR</title>
  <meta name="description" content="Daily list-price snapshots for major AI model platforms — the upstream valuation source for COFAIR attribution." />
  <link rel="canonical" href="https://cofair.org/pricing/" />
  <meta property="og:url" content="https://cofair.org/pricing/" />
  <link rel="icon" href="vendor/cofair-color-logo.svg" />
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="vendor/cofair-ui.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/chart.umd.min.js" defer></script>
  <script src="vendor/chartjs-adapter-date-fns.bundle.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="page-header">
    <a class="page-header__brand" href="https://cofair.org" aria-label="COFAIR">
      <img src="vendor/cofair-bw-lockup-horizontal.svg" alt="COFAIR" height="24" />
    </a>
    <div>
      <h1 class="cofair-heading cofair-heading--2">AI model pricing</h1>
    </div>
  </header>

  <main class="page">
    <div class="cofair-tabs">
      <div class="cofair-tabs__list" role="tablist" aria-label="Pricing views">
        <button type="button" role="tab" class="cofair-tabs__tab cofair-tabs__tab--active"
                id="tab-trends" aria-selected="true" aria-controls="panel-trends"
                data-tab="trends" tabindex="0">Trends</button>
        <button type="button" role="tab" class="cofair-tabs__tab"
                id="tab-archive" aria-selected="false" aria-controls="panel-archive"
                data-tab="archive" tabindex="-1">Archive</button>
        <button type="button" role="tab" class="cofair-tabs__tab"
                id="tab-changes" aria-selected="false" aria-controls="panel-changes"
                data-tab="changes" tabindex="-1">Price changes</button>
      </div>

      <div class="cofair-tabs__panel" role="tabpanel" id="panel-trends"
           aria-labelledby="tab-trends" data-panel="trends">
        <div class="controls">
          <fieldset class="control-group">
            <legend class="cofair-label">Providers</legend>
            <div class="chip-row" id="providerFilter"></div>
          </fieldset>

          <fieldset class="control-group">
            <legend class="cofair-label">Modality</legend>
            <div class="chip-row" id="modalityFilter"></div>
          </fieldset>

          <div class="cofair-field control-group">
            <label class="cofair-label" for="priceField">Price field</label>
            <select class="cofair-select" id="priceField">
              <option value="input_price" selected>Input</option>
              <option value="output_price">Output</option>
              <option value="cached_input_price">Cached input</option>
            </select>
          </div>

          <div class="cofair-field control-group">
            <label class="cofair-label" for="bucket">Bucket</label>
            <select class="cofair-select" id="bucket">
              <option value="daily" selected>Daily</option>
              <option value="weekly">Weekly (last in week)</option>
            </select>
          </div>

          <div class="cofair-field control-group">
            <label class="cofair-label" for="yScale">Y-axis</label>
            <select class="cofair-select" id="yScale">
              <option value="logarithmic" selected>Log</option>
              <option value="linear">Linear</option>
            </select>
          </div>

          <fieldset class="control-group">
            <legend class="cofair-label">Show</legend>
            <div class="choice-row">
              <label class="cofair-choice">
                <input class="cofair-choice__control" type="checkbox" id="activeOnly" checked />
                <span>Active models only</span>
              </label>
              <label class="cofair-choice">
                <input class="cofair-choice__control" type="checkbox" id="changedOnly" />
                <span>Only changed prices</span>
              </label>
            </div>
          </fieldset>
        </div>

        <div class="cofair-card chart-card">
          <div class="chart-card__plot">
            <canvas id="trendChart"></canvas>
          </div>
          <aside class="chart-legend" aria-label="Models">
            <h2 class="chart-legend__header cofair-text cofair-text--xs" id="trendLegendHeader" hidden></h2>
            <ul class="chart-legend__list" id="trendLegendList"></ul>
          </aside>
        </div>
      </div>

      <div class="cofair-tabs__panel" role="tabpanel" id="panel-archive"
           aria-labelledby="tab-archive" data-panel="archive" hidden>
        <div class="controls">
          <fieldset class="control-group">
            <legend class="cofair-label">Providers</legend>
            <div class="chip-row" id="archiveProviderFilter"></div>
          </fieldset>
          <div class="cofair-field control-group control-group--wide">
            <label class="cofair-label" for="archiveFilter">Show</label>
            <select class="cofair-select" id="archiveFilter">
              <option value="deprecated">Models flagged deprecated/retired</option>
              <option value="all" selected>All non-active history</option>
            </select>
          </div>
        </div>

        <div class="cofair-card">
          <div class="cofair-table__scroll">
            <table class="cofair-table cofair-table--striped">
              <thead class="cofair-table__head">
                <tr class="cofair-table__row">
                  <th class="cofair-table__th archive-col-name" scope="col">Display name</th>
                  <th class="cofair-table__th" scope="col">First seen</th>
                  <th class="cofair-table__th" scope="col">Last active</th>
                  <th class="cofair-table__th" scope="col">Flagged on</th>
                  <th class="cofair-table__th" scope="col">Last seen</th>
                  <th class="cofair-table__th cofair-table__th--num" scope="col">Last input</th>
                  <th class="cofair-table__th cofair-table__th--num archive-col-first-price" scope="col" hidden>First input</th>
                  <th class="cofair-table__th cofair-table__th--num" scope="col">Last output</th>
                  <th class="cofair-table__th cofair-table__th--num archive-col-first-price" scope="col" hidden>First output</th>
                </tr>
              </thead>
              <tbody class="cofair-table__body" id="archiveBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="cofair-tabs__panel" role="tabpanel" id="panel-changes"
           aria-labelledby="tab-changes" data-panel="changes" hidden>
        <div class="controls">
          <fieldset class="control-group">
            <legend class="cofair-label">Providers</legend>
            <div class="chip-row" id="changesProviderFilter"></div>
          </fieldset>
        </div>
        <div class="cofair-card">
          <div class="cofair-table__scroll">
            <table class="cofair-table cofair-table--striped">
              <thead class="cofair-table__head">
                <tr class="cofair-table__row">
                  <th class="cofair-table__th" scope="col">Date</th>
                  <th class="cofair-table__th" scope="col">Model</th>
                  <th class="cofair-table__th" scope="col">Field</th>
                  <th class="cofair-table__th cofair-table__th--num" scope="col">From</th>
                  <th class="cofair-table__th cofair-table__th--num" scope="col">To</th>
                  <th class="cofair-table__th cofair-table__th--num" scope="col">Change</th>
                </tr>
              </thead>
              <tbody class="cofair-table__body" id="changesBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
